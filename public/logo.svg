<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Rocket / Apex Gradient -->
    <linearGradient id="rocketGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Core Orb Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0" />
    </radialGradient>

    <!-- Radar Ring Gradient -->
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.5" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle / Rounded App Icon Base -->
  <rect x="32" y="32" width="960" height="960" rx="240" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="6" />

  <!-- Ambient Glow in Center -->
  <circle cx="512" cy="512" r="320" fill="url(#coreGlow)" opacity="0.3" filter="url(#strongGlow)" />

  <!-- Outer Target / Radar Ring -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="12 16" opacity="0.8" />
  <circle cx="512" cy="512" r="280" fill="none" stroke="url(#radarGrad)" stroke-width="6" opacity="0.6" filter="url(#glow)" />
  <circle cx="512" cy="512" r="180" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="8 8" opacity="0.7" />

  <!-- Crosshairs Target Marks -->
  <line x1="512" y1="110" x2="512" y2="170" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="512" y1="854" x2="512" y2="914" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="110" y1="512" x2="170" y2="512" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="854" y1="512" x2="914" y2="512" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />

  <!-- Radar Angle Ticks -->
  <circle cx="512" cy="232" r="6" fill="#38bdf8" />
  <circle cx="512" cy="792" r="6" fill="#6366f1" />
  <circle cx="232" cy="512" r="6" fill="#6366f1" />
  <circle cx="792" cy="512" r="6" fill="#10b981" />

  <!-- Rocket Exhaust Energy Trail (Downward Neon Plume) -->
  <polygon points="512,540 450,760 512,710 574,760" fill="url(#coreGlow)" opacity="0.8" filter="url(#strongGlow)" />
  <polygon points="512,560 480,720 512,680 544,720" fill="#38bdf8" opacity="0.9" />

  <!-- Main Geometric Ascending Apex / Rocket Motif -->
  <!-- Left Wing -->
  <polygon points="512,240 380,620 460,590 512,500" fill="#4338ca" opacity="0.9" />
  <!-- Right Wing -->
  <polygon points="512,240 644,620 564,590 512,500" fill="#3b82f6" opacity="0.9" />
  <!-- Center Fuselage with Neon Edge -->
  <polygon points="512,210 440,580 512,530 584,580" fill="url(#rocketGrad)" filter="url(#glow)" />
  
  <!-- Central AI Neural Diamond / Core -->
  <polygon points="512,380 550,440 512,500 474,440" fill="#ffffff" filter="url(#glow)" />
  <circle cx="512" cy="440" r="14" fill="#38bdf8" filter="url(#strongGlow)" />

  <!-- Target Lock Success Indicator (Accent Dot in Top Right) -->
  <circle cx="710" cy="314" r="16" fill="#10b981" filter="url(#strongGlow)" />
  <circle cx="710" cy="314" r="8" fill="#ffffff" />
</svg>
