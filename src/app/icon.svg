<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background base rounded square -->
  <rect width="128" height="128" rx="28" fill="#090d16" stroke="#252b42" stroke-width="3"/>
  <circle cx="64" cy="64" r="54" fill="url(#cyberGlow)"/>

  <!-- Target Rings -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#neonGradient)" stroke-width="4" stroke-opacity="0.5" stroke-dasharray="10 6"/>
  <circle cx="64" cy="64" r="30" fill="none" stroke="url(#neonGradient)" stroke-width="4.5" filter="url(#laserGlow)"/>
  <circle cx="64" cy="64" r="16" fill="none" stroke="#38bdf8" stroke-width="3.5" filter="url(#laserGlow)"/>

  <!-- Crosshairs -->
  <line x1="64" y1="12" x2="64" y2="38" stroke="url(#neonGradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="90" x2="64" y2="116" stroke="url(#neonGradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="12" y1="64" x2="38" y2="64" stroke="url(#neonGradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="64" x2="116" y2="64" stroke="url(#neonGradient)" stroke-width="4" stroke-linecap="round"/>

  <!-- Center Laser Bullseye -->
  <circle cx="64" cy="64" r="7" fill="#ffffff" filter="url(#laserGlow)"/>
  <circle cx="64" cy="64" r="4" fill="#38bdf8"/>
</svg>
